<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Product | Magpie Arts</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Roboto+Serif:opsz,wght@8..144,700&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f8fbff;
      font-family: 'Candara', Arial, sans-serif;
      color: #222;
    }

    .prod-viewer {
      max-width: 1200px;
      margin: 40px auto 30px auto;
      display: flex;
      gap: 3.5rem;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 22px rgba(80,120,220,0.10);
      padding: 2.5rem;
      user-select: none;
      position: relative;
    }

    .back-arrow-icon {
      position: absolute;
      top: 20px;
      left: 20px;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      outline: none;
      width: 50px;
      height: 50px;
      z-index: 10;
    }

    .back-arrow-icon::before {
      content: "";
      display: block;
      width: 50px;
      height: 50px;
      background: url("https://raw.githubusercontent.com/magpieartsinfo/Magpie-Arts/main/SVG/undo.svg") no-repeat center center;
      background-size: contain;
    }

    .img-section {
      width: 430px;
      min-width: 310px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.8rem;
    }

    .main-img-wrap {
      position: relative;
      width: 350px;
      height: 466px;
      overflow: hidden;
      border-radius: 15px;
      box-shadow: 0 6px 30px rgba(64, 105, 215, 0.15);
      background: #fafdff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .main-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 15px;
      position: absolute;
      top: 0;
      left: 0;
      transition: opacity 0.4s ease-in-out;
      user-select: none;
    }

    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 2rem;
      color: #8ba4c6;
      background: #f4f8faa6;
      border: none;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 5;
      transition: background 0.2s;
      user-select: none;
    }

    .arrow:hover {
      background: #bbe1ff;
    }

    .arrow.left {
      left: 12px;
    }

    .arrow.right {
      right: 12px;
    }

    .thumbs {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }

    .thumbs img {
      width: 58px;
      height: 58px;
      object-fit: cover;
      border-radius: 8px;
      border: 2px solid #dbeffd;
      cursor: pointer;
      transition: border-color 0.2s;
      user-select: none;
    }

    .thumbs img.selected,
    .thumbs img:hover {
      border-color: #294ad3;
    }

    .detail-section {
      flex: 1;
      min-width: 330px;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      margin-top: 20px;
    }

    .title-area {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .title-area h1 {
      font-family: 'Roboto Serif', serif;
      font-weight: 900;
      font-size: 2.1rem;
      margin: 0;
      color: #253060;
      letter-spacing: 0.01em;
    }

    .desc-area {
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .desc-area p {
      margin-bottom: 12px;
    }

    .note-hl {
      display: block;
      background: #fdeef5;
      margin-top: 10px;
      border-left: 4px solid #fa71a3;
      color: #834659;
      padding: 0.9em 1em;
      border-radius: 7px;
      font-size: 0.99em;
    }

    .price-area {
      font-family: 'Montserrat', Arial, sans-serif;
      font-size: 1.8rem;
      font-weight: 700;
      color: #1c3a92;
      padding: 0.15rem 0;
    }

    .star-review {
      font-size: 1.5rem;
      color: #cacaca;
      user-select: none;
      margin-bottom: 0.7rem;
    }

    .star-review .star {
      cursor: pointer;
      transition: color 0.2s;
      color: #bbb;
    }

    .star-review .star.selected {
      color: #ffbc0a;
    }

    .review-count {
      font-size: 0.95rem;
      margin-left: 8px;
      color: #666;
    }

    #submitReviewBtn {
      margin-left: 12px;
      padding: 6px 14px;
      font-weight: 600;
      background: #0472ff;
      border: none;
      border-radius: 6px;
      color: white;
      cursor: pointer;
      font-size: 0.9rem;
    }

    #submitReviewBtn:disabled {
      background: #9ec9ff;
      cursor: not-allowed;
    }

    .prod-options {
      margin-bottom: 0.8rem;
      font-family: Arial, sans-serif;
    }

    .option-title {
      display: block;
      font-weight: 700;
      font-size: 1.05rem;
      margin-bottom: 8px;
      color: #174197;
      user-select: none;
    }

    .option-group {
      margin-bottom: 0.9rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.7em;
    }

    .option-group button {
      font-family: inherit;
      font-size: 1rem;
      padding: 8px 16px;
      border-radius: 7px;
      border: 2.2px solid #80b6fca6;
      background: #fafdff;
      color: #086eb2;
      cursor: pointer;
      transition: background 0.16s, border 0.18s;
    }

    .option-group button.selected,
    .option-group button:hover {
      background: #0472ff;
      color: #fff;
      border-color: #0472ff;
    }

    .option-group button:disabled {
      background: #d5e5fc;
      border-color: #bbe2fa;
      color: #9bbed9;
      cursor: not-allowed;
    }

    .options-divider {
      border: 0;
      height: 1.5px;
      background: #e5e6ef;
      margin: 8px 0 12px 0;
      opacity: 0.8;
    }

    .form-row {
      margin-bottom: 1.25em;
    }

    .form-row label {
      font-size: 1rem;
      font-weight: 600;
      display: block;
      margin-bottom: 0.4em;
    }

    .form-row input {
      width: 100%;
      padding: 10px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
    }

    .add-cart-row {
      display: flex;
      gap: 1rem;
      margin-bottom: 1rem;
      align-items: center;
    }

    .add-cart-row button {
      font-family: 'Montserrat', Arial, sans-serif;
      font-weight: 700;
      font-size: 1.12rem;
      padding: 0.9rem 2.2rem;
      border-radius: 30px;
      border: none;
      cursor: pointer;
      user-select: none;
      transition: all 0.3s ease;
      text-transform: uppercase;
    }

    .add-cart-btn {
      background: linear-gradient(135deg, #1f39a5 0%, #2970f7 100%);
      color: #fff;
      box-shadow: 0 5px 15px rgb(49 74 181 / 50%);
    }

    .add-cart-btn:hover {
      background: linear-gradient(135deg, #1654a9 0%, #194bab 100%);
      box-shadow: 0 6px 20px rgb(75 113 238 / 55%);
      transform: translateY(-3px);
    }

    .buy-now-btn {
      background: #ffbc0a;
      color: #231a01;
      box-shadow: 0 4px 14px rgb(255 171 0 / 60%);
    }

    .buy-now-btn:hover {
      background: #ff9e04;
      box-shadow: 0 6px 25px rgb(255 169 0 / 75%);
      transform: translateY(-3px);
    }

    .view-cart-btn {
      background: #444;
      color: #fff;
    }

    .view-cart-btn:hover {
      background: #222;
      transform: translateY(-3px);
    }

    .upload-photo-row {
      display: none;
      margin-bottom: 1.2em;
    }

    .loading-msg {
      text-align: center;
      padding: 60px 20px;
      font-size: 1.2rem;
      color: #0472ff;
    }

    .error-msg {
      text-align: center;
      padding: 60px 20px;
      font-size: 1.2rem;
      color: #e84265;
    }

    @media (max-width: 1020px) {
      .prod-viewer {
        flex-direction: column;
        align-items: center;
        padding: 1rem;
      }

      .img-section {
        order: -1;
        width: 100%;
        max-width: 350px;
      }

      .main-img-wrap {
        width: 98vw;
        height: calc(98vw * 4 / 3);
        max-width: 430px;
      }
    }

    @media (max-width: 600px) {
      .prod-viewer {
        padding: 0.7rem;
      }

      .img-section,
      .main-img-wrap {
        width: 98vw;
      }

      .detail-section {
        min-width: 100%;
        margin-top: -40px;
      }

      .main-img-wrap {
        height: calc(98vw * 4 / 3);
      }

      .add-cart-row {
        flex-direction: column;
        gap: 0.7rem;
      }

      .add-cart-row button {
        width: 100%;
      }

      .back-arrow-icon {
        top: -20px;
        left: 8px;
      }

      .title-area h1 {
        font-size: 1.6rem;
      }

      .price-area {
        font-size: 1.4rem;
      }
    }
  </style>
</head>

<body>
  <div class="prod-viewer" id="prodViewer">
    <button class="back-arrow-icon" title="Back to Shop" onclick="goBack()" aria-label="Back to Shop"></button>

    <div class="img-section" id="imgSection">
      <div class="main-img-wrap" id="mainImgWrap">
        <button id="leftArrow" class="arrow left" aria-label="Previous image">&lt;</button>
        <img id="mainImage" src="" alt="Product View" draggable="false" />
        <button id="rightArrow" class="arrow right" aria-label="Next image">&gt;</button>
      </div>
      <div id="thumbsContainer" class="thumbs"></div>
    </div>

    <div class="detail-section">
      <div class="title-area">
        <h1 id="productTitle">Loading...</h1>
        <div class="star-review" id="starReview">
          <span class="star" data-value="1">★</span>
          <span class="star" data-value="2">★</span>
          <span class="star" data-value="3">★</span>
          <span class="star" data-value="4">★</span>
          <span class="star" data-value="5">★</span>
          <button id="submitReviewBtn" disabled>Submit</button>
          <span class="review-count" id="reviewCount">(0 reviews)</span>
        </div>
        <div id="descArea" class="desc-area"></div>
        <span class="note-hl">* Prices above Rs. 1,399 qualify for free delivery. * Upload clear HD photos.</span>
      </div>

      <div class="price-area">
        <span id="productPrice">Rs. 0</span>
      </div>

      <form id="orderForm">
        <div class="prod-options">
          <label class="option-title">Canvas Size</label>
          <div class="option-group" id="sizeOptions"></div>
          <hr class="options-divider" />
          <label class="option-title">Color Palette</label>
          <div class="option-group" id="paletteOptions"></div>
        </div>

        <div class="form-row upload-photo-row" id="uploadPhotoRow">
          <label for="uploadInput">Upload your photo <span style="color:red">*</span></label>
          <input id="uploadInput" type="file" accept="image/*" />
        </div>

        <div class="add-cart-row">
          <button class="add-cart-btn" type="button" onclick="addToCart()">ADD TO CART</button>
          <button class="buy-now-btn" type="submit">BUY IT NOW</button>
          <button class="view-cart-btn" type="button" onclick="goToCart()">VIEW CART</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseUrl = "https://rxtukfjjeruospodnkdz.supabase.co";
    const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ4dHVrZmpqZXJ1b3Nwb2Rua2R6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTc0ODc0NTQsImV4cCI6MjA3MzA2MzQ1NH0.-sgX4XjHiamnzyqDdlmBlrPgaPMgX8GbzdB1c2rnSc0";
    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

    let products = [];
    let currentProduct = null;
    let selectedOpts = { size: 0, palette: 0 };
    let currentImageIndex = 0;
    let selectedRating = 0;

    document.addEventListener('DOMContentLoaded', function () {
      const productTitleElem = document.getElementById('productTitle');
      const descAreaElem = document.getElementById('descArea');
      const productPriceElem = document.getElementById('productPrice');
      const mainImgWrap = document.getElementById('mainImgWrap');
      const mainImage = document.getElementById('mainImage');
      const thumbsContainer = document.getElementById('thumbsContainer');
      const sizeOptionsElem = document.getElementById('sizeOptions');
      const paletteOptionsElem = document.getElementById('paletteOptions');
      const uploadPhotoRow = document.getElementById('uploadPhotoRow');
      const uploadInput = document.getElementById('uploadInput');
      const starReview = document.getElementById('starReview');
      const submitBtn = document.getElementById('submitReviewBtn');
      const stars = [...starReview.querySelectorAll('.star')];

      function goBack() {
        window.location.href = 'https://magpieartsinfo.github.io/Magpie-Arts/shop.html';
      }

      function goToCart() {
        window.location.href = 'https://magpieartsinfo.github.io/Magpie-Arts/cart.html';
      }

      async function fetchProducts() {
        try {
          const response = await fetch('products.json?v=' + Date.now());
          if (!response.ok) throw new Error('Could not fetch products: ' + response.status);
          products = await response.json();
          console.log('Loaded products:', products);
          loadProduct();
        } catch (error) {
          console.error('Fetch error:', error);
          productTitleElem.textContent = "Error loading product";
          descAreaElem.textContent = "Please refresh the page and try again.";
        }
      }

      function loadProduct() {
        const urlParams = new URLSearchParams(window.location.search);
        const index = parseInt(urlParams.get('index'), 10);
        if (isNaN(index) || index < 0 || index >= products.length) {
          productTitleElem.textContent = "Product Not Found";
          descAreaElem.textContent = "The requested product could not be found.";
          return;
        }
        currentProduct = products[index];
        setupProduct();
      }

      function updateImage(newIndex) {
        if (newIndex === currentImageIndex) return;
        const images = [
          currentProduct.image,
          'https://raw.githubusercontent.com/magpieartsinfo/Magpie-Arts/main/images/size-selector.png',
          'https://raw.githubusercontent.com/magpieartsinfo/Magpie-Arts/main/images/kit-includes.png'
        ];

        const currentMainImage = document.getElementById('mainImage');
        const newImg = document.createElement('img');
        newImg.src = images[newIndex];
        newImg.alt = newIndex === 0 ? currentProduct.title : (newIndex === 1 ? "Size selector" : "Kit includes");
        newImg.style.opacity = '0';
        newImg.style.position = 'absolute';
        newImg.style.top = '0';
        newImg.style.left = '0';
        newImg.style.width = '100%';
        newImg.style.height = '100%';
        newImg.style.objectFit = 'cover';
        newImg.style.borderRadius = '15px';
        newImg.style.transition = 'opacity 0.4s ease-in-out';
        mainImgWrap.appendChild(newImg);

        setTimeout(() => {
          newImg.style.opacity = '1';
          currentMainImage.style.opacity = '0';
        }, 10);

        setTimeout(() => {
          if (currentMainImage.parentNode) {
            currentMainImage.parentNode.removeChild(currentMainImage);
          }
          newImg.id = 'mainImage';
          currentImageIndex = newIndex;
          Array.from(thumbsContainer.children).forEach((thumb, idx) =>
            thumb.classList.toggle('selected', idx === newIndex));
        }, 400);
      }

      function setupProduct() {
        if (!currentProduct) return;
        productTitleElem.textContent = currentProduct.title;

        let descParagraphs = currentProduct.desc.split(/\n{2,}/);
        descAreaElem.innerHTML = descParagraphs
          .map(p => `<p>${p.replace(/\n/g, '<br/>')}</p>`).join('');

        const images = [
          currentProduct.image,
          'https://raw.githubusercontent.com/magpieartsinfo/Magpie-Arts/main/images/size-selector.png',
          'https://raw.githubusercontent.com/magpieartsinfo/Magpie-Arts/main/images/kit-includes.png'
        ];

        mainImage.src = images[0];
        currentImageIndex = 0;

        thumbsContainer.innerHTML = '';
        images.forEach((src, i) => {
          const thumb = document.createElement('img');
          thumb.src = src;
          thumb.alt = i === 0 ? currentProduct.title : (i === 1 ? "Size selector" : "Kit includes");
          thumb.className = i === 0 ? 'selected' : '';
          thumb.addEventListener('click', () => updateImage(i));
          thumbsContainer.appendChild(thumb);
        });

        document.getElementById('leftArrow').onclick = () => {
          const newIndex = (currentImageIndex - 1 + images.length) % images.length;
          updateImage(newIndex);
        };

        document.getElementById('rightArrow').onclick = () => {
          const newIndex = (currentImageIndex + 1) % images.length;
          updateImage(newIndex);
        };

        const sizes = [
          { label: '10x12 Inch', value: '10x12' },
          { label: '18x20 Inch', value: '18x20' }
        ];
        const palettes = [
          { label: '16 colors', value: 16 },
          { label: '20 colors', value: 20 },
          { label: '24 colors', value: 24 }
        ];

        createOptionButtons(sizeOptionsElem, sizes, 'size');
        createOptionButtons(paletteOptionsElem, palettes, 'palette');

        updatePaletteOptions(selectedOpts.size);
        updatePrice();

        if (currentProduct.isCustomKit) {
          uploadPhotoRow.style.display = "block";
          uploadInput.required = true;
        } else {
          uploadPhotoRow.style.display = "none";
          uploadInput.required = false;
        }

        renderReview(currentProduct);
      }

      function highlightStars(rating) {
        stars.forEach((star, i) => {
          star.classList.toggle("selected", i < rating);
        });
      }

      stars.forEach((star, idx) => {
        star.addEventListener("mouseenter", () => highlightStars(idx + 1));
        star.addEventListener("mouseleave", () => highlightStars(selectedRating));
        star.addEventListener("click", () => {
          selectedRating = idx + 1;
          highlightStars(selectedRating);
          submitBtn.disabled = false;
        });
      });

      submitBtn.addEventListener("click", async () => {
        if (selectedRating === 0) return;
        await saveReviewToSupabase(currentProduct, selectedRating);
        selectedRating = 0;
        highlightStars(0);
        submitBtn.disabled = true;
        await renderReviewFromSupabase(currentProduct);
        alert("Thank you for your review!");
      });

      function renderReview(product) {
        let reviews = loadReview(product);
        let avg = reviews.length > 0 ? (reviews.reduce((acc, r) => acc + r.stars, 0) / reviews.length).toFixed(1) : 0;
        let count = reviews.length;
        stars.forEach((star, i) => star.classList.toggle("selected", i < Math.round(avg)));
        document.getElementById("reviewCount").textContent = count ? `(${count} review${count > 1 ? "s" : ""}, avg ${avg}★)` : "(0 reviews)";
        submitBtn.disabled = true;
      }

      function getReviewKey(product) {
        return "review_" + (product.title || "").replace(/\s+/g, "_");
      }

      function loadReview(product) {
        const key = getReviewKey(product);
        return JSON.parse(localStorage.getItem(key) || "[]");
      }

      async function saveReviewToSupabase(product, stars) {
        const { error } = await supabase.from('reviews').insert([{
          product_title: product.title,
          stars: stars,
          timestamp: Date.now()
        }]);
        if (error) console.error("Review save error:", error);
      }

      async function loadReviewsFromSupabase(product) {
        const { data, error } = await supabase.from('reviews').select('*').eq('product_title', product.title);
        return error ? [] : data || [];
      }

      async function renderReviewFromSupabase(product) {
        let reviews = await loadReviewsFromSupabase(product);
        let avg = reviews.length > 0 ? (reviews.reduce((acc, r) => acc + r.stars, 0) / reviews.length).toFixed(1) : 0;
        let count = reviews.length;
        stars.forEach((star, i) => star.classList.toggle("selected", i < Math.round(avg)));
        document.getElementById("reviewCount").textContent = count ? `(${count} review${count > 1 ? "s" : ""}, avg ${avg}★)` : "(0 reviews)";
        submitBtn.disabled = true;
      }

      function createOptionButtons(container, options, groupName) {
        container.innerHTML = '';
        options.forEach((opt, idx) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.textContent = opt.label;
          btn.onclick = () => selectOption(groupName, idx);
          if ((groupName === 'size' && idx === selectedOpts.size) ||
              (groupName === 'palette' && idx === selectedOpts.palette)) {
            btn.classList.add('selected');
          }
          container.appendChild(btn);
        });
      }

      function selectOption(group, idx) {
        selectedOpts[group] = idx;
        const container = group === 'size' ? sizeOptionsElem : paletteOptionsElem;
        Array.from(container.children).forEach((btn, i) =>
          btn.classList.toggle('selected', i === idx));
        if (group === 'size') {
          updatePaletteOptions(idx);
        }
        updatePrice();
      }

      function updatePaletteOptions(sizeIdx) {
        const paletteBtns = paletteOptionsElem.querySelectorAll("button");
        if (sizeIdx === 0) {
          paletteBtns[0].disabled = false;
          paletteBtns[1].disabled = false;
          paletteBtns[2].disabled = true;
          if (selectedOpts.palette === 2) selectOption('palette', 0);
        } else {
          paletteBtns[0].disabled = true;
          paletteBtns[1].disabled = false;
          paletteBtns[2].disabled = false;
          if (selectedOpts.palette === 0) selectOption('palette', 1);
        }
      }

      function updatePrice() {
        if (!currentProduct) return;
        let price = 0;
        if (selectedOpts.size === 0 && selectedOpts.palette === 0) price = currentProduct.priceS1C16 || 0;
        else if (selectedOpts.size === 0 && selectedOpts.palette === 1) price = currentProduct.priceS1C20 || 0;
        else if (selectedOpts.size === 1 && selectedOpts.palette === 1) price = currentProduct.priceS2C20 || 0;
        else if (selectedOpts.size === 1 && selectedOpts.palette === 2) price = currentProduct.priceS2C24 || 0;
        productPriceElem.innerText = 'Rs. ' + price.toLocaleString();
      }

      function addToCart() {
        if (!currentProduct) {
          alert("Invalid product");
          return;
        }
        const sizeOption = selectedOpts.size === 0 ? '10x12 Inch' : '18x20 Inch';
        let paletteOption = ['16 colors', '20 colors', '24 colors'][selectedOpts.palette];
        let price = [currentProduct.priceS1C16, currentProduct.priceS1C20, currentProduct.priceS2C20, currentProduct.priceS2C24][
          selectedOpts.size * 2 + (selectedOpts.palette - (selectedOpts.size === 0 ? 0 : 1))
        ];

        const cartItem = {
          id: currentProduct.id || Date.now(),
          title: currentProduct.title,
          size: sizeOption,
          palette: paletteOption,
          price: price,
          quantity: 1,
          image: currentProduct.image,
          isCustomKit: currentProduct.isCustomKit
        };

        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        const existingIndex = cart.findIndex(item =>
          item.id === cartItem.id && item.size === cartItem.size && item.palette === cartItem.palette);
        if (existingIndex !== -1) {
          cart[existingIndex].quantity += 1;
        } else {
          cart.push(cartItem);
        }
        localStorage.setItem('cart', JSON.stringify(cart));
        alert("Product added to cart!");
      }

      function buyNow(e) {
        e.preventDefault();
        if (!currentProduct) {
          alert("Invalid product");
          return;
        }
        const sizeOption = selectedOpts.size === 0 ? '10x12 Inch' : '18x20 Inch';
        let paletteOption = ['16 colors', '20 colors', '24 colors'][selectedOpts.palette];
        let price = [currentProduct.priceS1C16, currentProduct.priceS1C20, currentProduct.priceS2C20, currentProduct.priceS2C24][
          selectedOpts.size * 2 + (selectedOpts.palette - (selectedOpts.size === 0 ? 0 : 1))
        ];

        const orderItem = {
          id: currentProduct.id || Date.now(),
          title: currentProduct.title,
          size: sizeOption,
          palette: paletteOption,
          price: price,
          quantity: 1,
          image: currentProduct.image,
          isCustomKit: currentProduct.isCustomKit
        };
        sessionStorage.setItem('directOrder', JSON.stringify(orderItem));
        window.location.href = 'https://magpieartsinfo.github.io/Magpie-Arts/checkout.html';
      }

      document.getElementById('orderForm').addEventListener('submit', buyNow);
      window.goBack = goBack;
      window.goToCart = goToCart;
      window.addToCart = addToCart;

      fetchProducts();
    });
  </script>
</body>
</html>
